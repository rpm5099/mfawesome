[tool.poetry]
packages = [{ include = "mfawesome" }, { include = "mfawesome_tests" }]

[project]
name = "mfawesome"
version = "0.1.90"
description = "CLI multi-factor authenticator: TOTP/HOTP 2FA/MFA codes in the terminal, encrypted secrets storage, Google Authenticator QR import/export, NTP time sync, fuzzy search"
authors = [{ name = "Rob Milloy", email = "rob@milloy.net" }]
license = "MIT"
readme = "README.md"
requires-python = ">= 3.10"
keywords = [
    "2fa",
    "mfa",
    "cli",
    "totp",
    "otp",
    "two-factor",
    "command-line",
    "security",
    "encryption",
    "time-based",
    "one-time-password",
    "multi-factor",
    "hotp",
    "HMAC",
    "authentication",
    "authenticator",
    "google-authenticator",
    "terminal",
    "qrcode",
    "secrets",
    "mfawesome",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Office/Business",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Topic :: Terminals",
    "Topic :: Utilities",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "rich",
    "PyYAML",
    "numpy",
    "cryptography >= 42.0",
    "opencv-contrib-python-headless >= 4.5",
    "protobuf",
    "qrcode[pil] >= 7.4",
]


[project.urls]
Homepage = "https://github.com/rpm5099/mfawesome"
Repository = "https://github.com/rpm5099/mfawesome"
"Bug Tracker" = "https://github.com/rpm5099/mfawesome/issues"

[project.optional-dependencies]
all = ["ruff", "pytest", "pytest-cov", "coverage", "dnspython"]
dev = ["ruff", "pytest", "pytest-cov", "coverage"]
test = ["pytest", "pytest-cov", "coverage"]
dns = ["dnspython"]

[project.scripts]
mfa = "mfawesome.exec_mfawesome:main"
mfaclock = "mfawesome.ntptime:Clock"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
branch = true
source = ["mfawesome"]
command_line = "-m pytest"

[tool.coverage.report]
include = ["mfawesome/*.py"]
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"
